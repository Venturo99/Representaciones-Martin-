<div class="login-container">
  <!-- COLUMNA IZQUIERDA: BRANDING -->
  <div class="login-branding">
    <img src="../assets/logo.png" alt="Representaciones Martín" class="logo" />
    <h2>Bienvenido</h2>
    <p>Sistema de Gestión de Inventarios</p>
  </div>

  <!-- COLUMNA DERECHA: FORMULARIO -->
  <div class="login-form-panel">
    <h1>Iniciar Sesión</h1>
    <p class="subtitle">Representaciones Martín S.A.C.</p>

    <form id="login-form" novalidate>
      <div class="input-group">
        <label for="email"
          ><i class="fas fa-envelope"></i> Correo Electrónico</label
        >
        <input
          type="email"
          id="email"
          placeholder="ejemplo@martin.com"
          required
        />
        <span class="error-message" id="email-error"></span>
      </div>

      <div class="input-group">
        <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          />
          <i class="fas fa-eye toggle-password" id="toggle-password"></i>
        </div>
        <span class="error-message" id="password-error"></span>
      </div>

      <div class="input-group">
        <label
          ><i class="fas fa-shield-alt"></i> Verificación de Seguridad</label
        >
        <div class="captcha-box">
          <span id="captcha-text">A7B9C</span>
          <button type="button" id="refresh-captcha">
            <i class="fas fa-sync-alt"></i>
          </button>
        </div>
        <input
          type="text"
          id="captcha-input"
          placeholder="Ingrese el código"
          required
        />
        <span class="error-message" id="captcha-error"></span>
      </div>

      <a href="#" id="forgot-password-link" class="forgot-link"
        >¿Olvidaste tu contraseña?</a
      >

      <button type="submit" class="btn-primary" id="login-btn">
        <span>Ingresar</span> <i class="fas fa-sign-in-alt"></i>
      </button>
    </form>

    <div id="global-message" class="global-message hidden"></div>
  </div>

  <!-- Modal de Recuperación -->
  <div id="forgot-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3><i class="fas fa-key"></i> Recuperar Contraseña</h3>
      <p>Ingresa tu correo y te enviaremos un token de recuperación.</p>
      <form id="forgot-form">
        <div class="input-group">
          <input
            type="email"
            id="forgot-email"
            placeholder="Tu correo electrónico"
            required
          />
          <span class="error-message" id="forgot-email-error"></span>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="close-modal">
            Cancelar
          </button>
          <button type="submit" class="btn-primary">Enviar Token</button>
        </div>
      </form>
    </div>
  </div>
</div>
